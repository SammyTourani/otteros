[package]
name = "otter-virtio"
version = "0.1.0"
edition = "2024"
publish = false
description = "OtterOS virtio 1.x split virtqueues: split ring management, EVENT_IDX notification suppression, modern PCI device initialization. no_std+alloc, zero dependencies (DECISIONS.md D2, D27)."
license = "MIT OR Apache-2.0"

# DECISIONS.md D27: pure crates in crates/ carry zero external dependencies.
# core+alloc only; std is used solely under `cfg(test)` for std::thread and small PRNG.
[dependencies]

[lib]
name = "otter_virtio"
path = "src/lib.rs"

[package]
name = "otter-netlogic"
version = "0.1.0"
edition = "2024"
publish = false
description = "OtterOS network logic: sans-I/O ARP cache, DHCP client and DNS resolver state machines. no_std+alloc, zero dependencies (DECISIONS.md D2, D27)."
license = "MIT OR Apache-2.0"

# DECISIONS.md D27: pure crates in crates/ carry zero external dependencies.
[dependencies]
otter-net-proto = { path = "../otter-net-proto" }

[dev-dependencies]

[lib]
name = "otter_netlogic"
path = "src/lib.rs"

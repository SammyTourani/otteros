[build]
target = "x86_64-unknown-none"
# The built-in x86_64-unknown-none target already disables the red zone,
# SSE/MMX (soft-float instead), and uses the kernel code model; the one
# thing it doesn't default to is a static (non-PIE) layout, which our
# higher-half linker script assumes.
rustflags = ["-C", "relocation-model=static"]
